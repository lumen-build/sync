name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4

      - name: Verify runtime versions
        run: |
          bun -e "if (Bun.version !== '1.3.4') throw new Error('expected Bun 1.3.4, got ' + Bun.version)"
          npm --version

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package:check

      - name: Verify tag matches package version
        working-directory: packages/sync
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + version)"

      - run: npm publish ./packages/sync --access public
