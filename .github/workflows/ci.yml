name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun -e "if (Bun.version !== '1.3.4') throw new Error('expected Bun 1.3.4, got ' + Bun.version)"

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - run: bun packages/sync/dist/cli.js --help

  package:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun -e "if (Bun.version !== '1.3.4') throw new Error('expected Bun 1.3.4, got ' + Bun.version)"

      - run: bun install --frozen-lockfile

      - run: bun run package:check

  product-e2e:
    name: Packed product E2E
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun -e "if (Bun.version !== '1.3.4') throw new Error('expected Bun 1.3.4, got ' + Bun.version)"

      - run: bun install --frozen-lockfile

      - run: bun run test:e2e:product

  harness-e2e:
    name: Real harness E2E (${{ matrix.harness }})
    runs-on: ubuntu-latest
    needs: product-e2e
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness:
          - claude
          - codex
          - gemini
          - opencode

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun -e "if (Bun.version !== '1.3.4') throw new Error('expected Bun 1.3.4, got ' + Bun.version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: packages/sync/e2e/fixtures/harness/package-lock.json

      - run: bun install --frozen-lockfile

      - run: npm ci --no-audit --no-fund
        working-directory: packages/sync/e2e/fixtures/harness

      - run: bun run test:e2e:harness
        env:
          LUMEN_HARNESS_AGENT: ${{ matrix.harness }}
          LUMEN_HARNESS_FIXTURE_NODE_MODULES: ${{ github.workspace }}/packages/sync/e2e/fixtures/harness/node_modules
